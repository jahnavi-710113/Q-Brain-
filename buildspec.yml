version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "Installing dependencies"

  pre_build:
    commands:
      - npm install

  build:
    commands:
      - echo "Running build"
      - npm test

  post_build:
    commands:
      - echo "Build completed"

artifacts:
  files:
    - '**/*'
  discard-paths: no
